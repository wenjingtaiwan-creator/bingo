<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>越南語 3D 賓果挑戰</title><style>
:root{font-family:system-ui,'Noto Sans TC',sans-serif;color:#2e3d33}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#e5f6ee,#fff4db);min-height:100vh}.wrap{max-width:1120px;margin:auto;padding:18px}h1{text-align:center;margin:8px 0;color:#176b56}p.sub{text-align:center;margin:0 0 16px}.panel{background:#ffffffdb;border:2px solid #d6e8d9;border-radius:22px;padding:16px;box-shadow:0 10px 25px #2b6d4830}.settings{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:15px}button,select,input,textarea{font:inherit;border-radius:12px;border:2px solid #bfd8c9;padding:10px;background:white}button{cursor:pointer;background:#178c70;color:white;border:0;font-weight:700}button.secondary{background:#f4c25f;color:#47321b}button:focus-visible,.cell:focus-visible{outline:4px solid #ffb624}textarea{width:100%;min-height:95px;resize:vertical}input[type=number]{width:95px}.hidden{display:none!important}.main{display:grid;grid-template-columns:minmax(0,1fr) 185px;gap:18px}.board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px;background:#b4dec4;border:8px solid #418b69;border-radius:20px;padding:10px;box-shadow:0 10px 0 #2e664c}.cell{position:relative;aspect-ratio:1/1;min-width:0;display:flex;align-items:center;justify-content:center;text-align:center;background:linear-gradient(#fffdf1,#f8ebc6);border:2px solid #d2bd83;border-radius:12px;font-size:clamp(12px,2.3vw,22px);font-weight:800;overflow:hidden;overflow-wrap:anywhere;cursor:pointer;padding:5px}.cell.marked{background:linear-gradient(#fff4ce,#f4dfa3)}.cell.win{background:#ffe46b;box-shadow:inset 0 0 0 4px #ec8b21}.token{width:70%;height:70%;border-radius:50%;background:radial-gradient(circle at 32% 25%,#fff7d4 0 8%,#ffb53d 24%,#ed6b28 67%,#b7401c 100%);box-shadow:inset -5px -8px 10px #91331c7d,inset 3px 3px 6px #fff8,0 7px 0 #a54321,0 9px 8px #0005;position:absolute;display:flex;align-items:center;justify-content:center;color:white;text-shadow:0 2px 3px #7d2812;font-size:clamp(16px,3vw,28px);z-index:2;pointer-events:none}.side{text-align:center}.side h3{margin:0 0 8px}.piece{width:72px;height:72px;border-radius:50%;margin:15px auto;background:radial-gradient(circle at 30% 25%,#ffe8a0,#f58b2b 65%,#a63c1a);box-shadow:inset -8px -9px 12px #9e361780,0 9px 0 #a34a20,0 14px 12px #0004;display:grid;place-items:center;font-size:32px;color:white;text-shadow:0 2px 4px #7b2815;cursor:grab;touch-action:none}.status{margin-top:15px;font-weight:700;text-align:center}.winbox{background:#fff3b0;border:3px solid #f4ba2d;border-radius:18px;padding:14px;text-align:center;margin-top:14px;font-size:24px;font-weight:900;animation:pop .5s ease}.tip{font-size:13px;color:#4d6657;line-height:1.6}.count{font-size:26px;font-weight:900;color:#176b56}@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}@media(max-width:700px){.wrap{padding:9px}.main{grid-template-columns:1fr}.side{display:flex;align-items:center;justify-content:space-between;gap:10px}.side h3{font-size:14px}.piece{width:55px;height:55px;margin:5px}.board{gap:4px;padding:5px;border-width:5px}.cell{border-radius:7px;font-size:clamp(10px,3vw,17px);padding:2px}.token{font-size:18px}.tip{font-size:12px}}
</style></head><body><div class="wrap"><h1>🌿 越南語 3D 賓果挑戰</h1><p class="sub">BINGO • 5 × 5 • 手動對題・連線獲勝</p><section class="panel settings"><label>題目類型 <select id="mode"><option value="numbers">數字</option><option value="words">自行輸入單字</option></select></label><label id="range">數字 1 到 <input type="number" id="max" min="25" max="999" value="50"></label><div id="wordarea" class="hidden" style="width:100%"><label for="words">輸入至少 25 個不同單字（每行一個，也可用逗號分隔）</label><textarea id="words" placeholder="một&#10;hai&#10;ba&#10;..."></textarea></div><button id="new">🎲 產生隨機賓果卡</button><button id="clear" class="secondary">↩ 清除棋子</button><button id="sound" class="secondary">🔊 音效：開</button></section><div class="main" style="margin-top:16px"><div class="panel"><div id="board" class="board" aria-label="5乘5賓果棋盤"></div><div class="status" id="status">請先產生賓果卡</div><div id="winbox" class="winbox hidden" role="status">🎉 BINGO! 恭喜連成五格！ 🎉</div></div><aside class="panel side"><div><h3>立體棋子</h3><div class="piece" id="piece" draggable="true" title="拖曳到格子">★</div><div class="tip">拖曳棋子到格子，或直接點擊格子放置／取回棋子。</div></div><div><div class="count" id="marked">0 / 25</div><div class="tip">已放置棋子</div></div></aside></div><p class="tip">📣 老師自行抽題、念題；本遊戲不會自動抽籤。每位學生產生的卡片順序都不同。手機可直接點格子，電腦也可拖曳棋子。</p></div><script>
const $=id=>document.getElementById(id);let entries=[],marked=new Set(),wins=new Set(),audioOn=true,won=false;const lines=[];for(let r=0;r<5;r++){lines.push([0,1,2,3,4].map(c=>r*5+c));lines.push([0,1,2,3,4].map(c=>c*5+r))}lines.push([0,6,12,18,24],[4,8,12,16,20]);function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function beep(){if(!audioOn)return;try{const C=window.AudioContext||window.webkitAudioContext;const ctx=new C();[523,659,784,1047].forEach((freq,i)=>{let o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=freq;o.connect(g);g.connect(ctx.destination);let t=ctx.currentTime+i*.16;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.2,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.35);o.start(t);o.stop(t+.36)});setTimeout(()=>ctx.close(),1800)}catch(e){}}function draw(){const b=$('board');b.innerHTML='';entries.forEach((v,i)=>{const c=document.createElement('div');c.className='cell'+(marked.has(i)?' marked':'')+(wins.has(i)?' win':'');c.tabIndex=0;c.setAttribute('role','button');c.setAttribute('aria-label',v+(marked.has(i)?' 已放棋子':''));const label=document.createElement('span');label.textContent=v;c.append(label);if(marked.has(i)){let token=document.createElement('div');token.className='token';token.textContent='★';c.append(token)}c.onclick=()=>toggle(i);c.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle(i)}};c.ondragover=e=>e.preventDefault();c.ondrop=e=>{e.preventDefault();place(i)};b.append(c)});$('marked').textContent=marked.size+' / 25'}function evaluate(){wins.clear();let completed=lines.filter(l=>l.every(i=>marked.has(i)));completed.forEach(l=>l.forEach(i=>wins.add(i)));$('winbox').classList.toggle('hidden',completed.length===0);$('status').textContent=completed.length?`🏆 已完成 ${completed.length} 條賓果線！`:`已標記 ${marked.size} 格，繼續加油！`;if(completed.length&&!won)beep();won=completed.length>0}function toggle(i){if(marked.has(i))marked.delete(i);else marked.add(i);evaluate();draw()}function place(i){if(!marked.has(i)){marked.add(i);evaluate();draw()}}function reset(){marked.clear();wins.clear();won=false;$('winbox').classList.add('hidden');$('status').textContent='開始挑戰！等待老師出題。';draw()}function generate(){let pool;if($('mode').value==='numbers'){const n=Number($('max').value);if(!Number.isInteger(n)||n<25||n>999){alert('請輸入 25 到 999 的整數。');return}pool=Array.from({length:n},(_,i)=>String(i+1))}else{pool=[...new Set($('words').value.split(/[\n,，、;；]+/).map(s=>s.trim()).filter(Boolean))];if(pool.length<25){alert(`目前只有 ${pool.length} 個不同單字，至少需要 25 個。`);return}}entries=shuffle(pool).slice(0,25);reset()}$('mode').onchange=()=>{$('range').classList.toggle('hidden',$('mode').value!=='numbers');$('wordarea').classList.toggle('hidden',$('mode').value!=='words')};$('new').onclick=generate;$('clear').onclick=reset;$('sound').onclick=()=>{audioOn=!audioOn;$('sound').textContent=audioOn?'🔊 音效：開':'🔇 音效：關'};$('piece').ondragstart=e=>e.dataTransfer.setData('text/plain','piece');generate();
</script></body></html>
